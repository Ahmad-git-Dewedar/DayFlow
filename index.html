<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="DayFlow — plan your day on a timeline, build habits that stick and track focused time. Private and local-first."
    />
    <title>DayFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The Arabic family is only downloaded when Arabic text is on screen (unicode-range). -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Set theme, language and text direction before first paint, so there is
      // no flash of the wrong theme or a left-to-right layout for Arabic users.
      (function () {
        var root = document.documentElement;
        try {
          var s = localStorage.getItem("dayflow-theme");
          var dark = s === "dark" || (s === null && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
        try {
          var lang = localStorage.getItem("dayflow-lang");
          if (lang !== "ar" && lang !== "en") {
            var first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
            lang = /^ar/i.test(first) ? "ar" : "en";
          }
          root.lang = lang;
          root.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
